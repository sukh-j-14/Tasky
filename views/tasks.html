<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Tasky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600 hover:opacity-80 transition-opacity cursor-pointer">Tasky</a>
            <div class="flex items-center space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-blue-600">Home</a>
                <a href="browsetask.html" class="text-gray-700 hover:text-blue-600">Browse Tasks</a>
                <a href="#" id="postTaskButton" class="text-gray-700 hover:text-blue-600">Post Task</a>

                <!-- Profile Dropdown -->
                <div id="profileSection" class="relative">
                    <button id="profileDropdown" class="focus:outline-none">
                        <img src="https://via.placeholder.com/40" alt="Profile" class="w-10 h-10 rounded-full">
                    </button>
                    <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2">
                        <a href="dashboard.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">Dashboard</a>
                        <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">My Profile</a>
                        <a href="tasks.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">My Tasks</a>
                        <a href="#" id="logout" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Tasks Content -->
    <section class="container mx-auto px-4 py-12">
        <h1 class="text-4xl font-bold text-gray-800 mb-8">My Tasks</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Active Tasks -->
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Active Tasks</h2>
                <ul class="space-y-3">
                    <li class="text-gray-700">Task <span class="font-bold">#123</span> - Due: 10/25/2023</li>
                    <li class="text-gray-700">Task <span class="font-bold">#124</span> - Due: 10/28/2023</li>
                </ul>
            </div>

            <!-- Completed Tasks -->
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Completed Tasks</h2>
                <ul class="space-y-3">
                    <li class="text-gray-700">Task <span class="font-bold">#121</span> - Completed: 10/20/2023</li>
                    <li class="text-gray-700">Task <span class="font-bold">#122</span> - Completed: 10/22/2023</li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-purple-600 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 Tasky. All rights reserved.</p>
        </div>
    </footer>

    <!-- Dropdown Script -->
    <script>
        // Toggle dropdown menu
        const profileDropdown = document.getElementById('profileDropdown');
        const dropdownMenu = document.getElementById('dropdownMenu');

        profileDropdown.addEventListener('click', () => {
            dropdownMenu.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (event) => {
            if (!profileDropdown.contains(event.target)) {
                dropdownMenu.classList.add('hidden');
            }
        });

        // Logout functionality
        document.getElementById('logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token'); // Clear the token
            alert('Logged out successfully');
            window.location.href = 'login.html'; // Redirect to login page
        });
    </script>
    <script src="shared/navigation.js"></script>
</body>
</html>
