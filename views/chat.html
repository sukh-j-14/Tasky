<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Tasky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .message-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }
        .message-bubble.sent {
            background: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
            color: white;
            margin-left: auto;
        }
        .message-bubble.received {
            background: #f3f4f6;
            color: #374151;
        }
        .typing-indicator {
            display: none;
        }
        .typing-indicator.show {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-purple-600">Tasky</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="text-gray-700 hover:text-purple-600">Dashboard</a>
                    <a href="browsetask.html" class="text-gray-700 hover:text-purple-600">Browse Tasks</a>
                    <a href="mytasks.html" class="text-gray-700 hover:text-purple-600">My Tasks</a>
                    <a href="profile.html" class="text-gray-700 hover:text-purple-600">Profile</a>
                    
                    <!-- Profile dropdown (shown when logged in) -->
                    <div id="profileSection" class="relative" style="display: none;">
                        <button id="profileDropdown" class="flex items-center space-x-2 focus:outline-none">
                            <img id="profileImage" src="https://via.placeholder.com/40" alt="Profile" class="w-8 h-8 rounded-full">
                            <span id="profileName" class="text-gray-700">User</span>
                            <i class="fas fa-chevron-down text-gray-400"></i>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
                            <a href="dashboard.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                            </a>
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-user mr-2"></i>Profile
                            </a>
                            <a href="mytasks.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tasks mr-2"></i>My Tasks
                            </a>
                            <a href="messages.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-envelope mr-2"></i>Messages
                            </a>
                            <hr class="my-2">
                            <a href="#" id="logout" class="block px-4 py-2 text-red-600 hover:bg-red-50">
                                <i class="fas fa-sign-out-alt mr-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Chat Container -->
    <div class="flex h-[calc(100vh-64px)]">
        <!-- Conversations Sidebar -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">Messages</h2>
            </div>

            <!-- Conversations List -->
            <div id="conversationsList" class="flex-1 overflow-y-auto">
                <!-- Conversations will be loaded here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col">
            <!-- Chat Header -->
            <div id="chatHeader" class="bg-white border-b border-gray-200 p-4 hidden">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                        <img id="chatUserAvatar" src="https://via.placeholder.com/40" alt="User" class="w-10 h-10 rounded-full object-cover">
                    </div>
                    <div>
                        <h3 id="chatUserName" class="font-semibold text-gray-900"></h3>
                        <p id="chatUserStatus" class="text-sm text-gray-500">Online</p>
                    </div>
                </div>
                <button id="backToConversations" class="md:hidden bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>

            <!-- Messages Area -->
            <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-4 hidden">
                <!-- Messages will be loaded here -->
            </div>

            <!-- Typing Indicator -->
            <div id="typingIndicator" class="typing-indicator px-4 py-2">
                <div class="flex items-center space-x-2 text-gray-500">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                    <span class="text-sm">Someone is typing...</span>
                </div>
            </div>

            <!-- Message Input -->
            <div id="messageInput" class="bg-white border-t border-gray-200 p-4 hidden">
                <form id="messageForm" class="flex space-x-3">
                    <input 
                        type="text" 
                        id="messageText" 
                        placeholder="Type your message..." 
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                        required
                    >
                    <button 
                        type="submit" 
                        class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <!-- No Conversation Selected -->
            <div id="noConversationSelected" class="flex-1 flex items-center justify-center">
                <div class="text-center">
                    <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-comments text-purple-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">Select a conversation</h3>
                    <p class="text-gray-500">Choose a conversation from the sidebar to start chatting</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Template -->
    <template id="messageTemplate">
        <div class="message-bubble p-3 rounded-lg mb-2 relative group">
            <div class="message-content"></div>
            <div class="message-time text-xs opacity-70 mt-1"></div>
            <button class="delete-message-btn absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600" title="Delete Message">
                <i class="fas fa-times text-xs"></i>
            </button>
        </div>
    </template>

    <!-- Conversation Template -->
    <template id="conversationTemplate">
        <div class="conversation-item p-4 border-b border-gray-100 hover:bg-gray-50 cursor-pointer">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                    <img class="conversation-avatar w-12 h-12 rounded-full object-cover" src="https://via.placeholder.com/48" alt="User">
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between">
                        <h4 class="conversation-name font-medium text-gray-900 truncate"></h4>
                        <span class="conversation-time text-xs text-gray-500"></span>
                    </div>
                    <p class="conversation-last-message text-sm text-gray-600 truncate"></p>
                    <div class="flex items-center justify-between mt-1">
                        <span class="conversation-task text-xs text-purple-600"></span>
                        <span id="unreadBadge" class="conversation-unread bg-purple-600 text-white text-xs px-2 py-1 rounded-full hidden"></span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="shared/navigation.js"></script>
    <script>
        let currentConversationId = null;
        let currentUser = null;
        let conversations = [];
        let messages = [];
        let messagePollingInterval = null;

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId');
        const bidId = urlParams.get('bidId');
        const participantId = urlParams.get('participantId');
        const conversationId = urlParams.get('conversationId');

        document.addEventListener('DOMContentLoaded', function() {
            console.log('Chat page loaded, URL params:', { taskId, participantId, bidId, conversationId });
            loadUserProfile();
            loadConversations();
            setupEventListeners();
        });

        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    currentUser = await response.json();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        async function loadConversations() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/messages/conversations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    conversations = data.conversations || [];
                    displayConversations();

                    // If we have a direct conversationId, load that conversation
                    if (conversationId) {
                        console.log('Loading direct conversation:', conversationId);
                        console.log('Available conversations:', conversations.map(c => c._id));
                        currentConversationId = conversationId;
                        loadMessages(conversationId);
                        // Find the conversation in the list to show chat area
                        const conversation = conversations.find(c => c._id === conversationId);
                        if (conversation) {
                            console.log('Found conversation:', conversation);
                            showChatArea(conversation);
                        } else {
                            console.log('Conversation not found in list, but loading messages anyway');
                            // Still try to load messages even if conversation not in list
                            // This handles cases where the conversation exists but wasn't returned in the list
                        }
                    } else if (taskId && participantId) {
                        console.log('Creating conversation with:', { taskId, participantId, bidId });
                        await createOrGetConversation(participantId, taskId, bidId);
                    } else {
                        console.log('Missing parameters for conversation creation:', { taskId, participantId, bidId });
                        // Show a message to the user
                        const mainContent = document.querySelector('.flex-1');
                        if (mainContent) {
                            mainContent.innerHTML = `
                                <div class="flex flex-col items-center justify-center h-full">
                                    <div class="text-center">
                                        <i class="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-4"></i>
                                        <h3 class="text-lg font-semibold text-gray-900 mb-2">Missing Chat Parameters</h3>
                                        <p class="text-gray-600 mb-4">Unable to create conversation. Please try clicking the contact button again.</p>
                                        <button onclick="window.close()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                                            Close
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                } else {
                    console.error('Failed to load conversations:', response.status);
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        async function createOrGetConversation(participantId, taskId, bidId) {
            try {
                const token = localStorage.getItem('token');
                console.log('Sending conversation request:', { participantId, taskId, bidId });
                
                const response = await fetch('/api/messages/conversations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        participantId,
                        taskId,
                        bidId
                    })
                });

                console.log('Conversation response status:', response.status);
                
                if (response.ok) {
                    const conversation = await response.json();
                    console.log('Conversation created/found:', conversation);
                    currentConversationId = conversation._id;
                    loadMessages(conversation._id);
                    showChatArea(conversation);
                } else {
                    const error = await response.json();
                    console.error('Failed to create conversation:', error);
                }
            } catch (error) {
                console.error('Error creating/getting conversation:', error);
            }
        }

        function displayConversations() {
            const container = document.getElementById('conversationsList');
            const template = document.getElementById('conversationTemplate');

            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="p-4 text-center text-gray-500">
                        <i class="fas fa-comments text-4xl mb-2"></i>
                        <p>No conversations yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            conversations.forEach(conversation => {
                const clone = template.content.cloneNode(true);
                
                // Get the other participant
                const otherParticipant = conversation.participants.find(p => p._id !== currentUser._id);
                
                clone.querySelector('.conversation-avatar').src = otherParticipant?.profilePicture || 'https://via.placeholder.com/48';
                clone.querySelector('.conversation-name').textContent = `${otherParticipant?.firstName} ${otherParticipant?.lastName}`;
                clone.querySelector('.conversation-time').textContent = formatTime(conversation.lastMessageAt);
                clone.querySelector('.conversation-last-message').textContent = conversation.lastMessage?.message || 'No messages yet';
                clone.querySelector('.conversation-task').textContent = conversation.taskId?.title || '';
                
                if (conversation.unreadCount > 0) {
                    const unreadBadge = clone.querySelector('.conversation-unread');
                    unreadBadge.textContent = conversation.unreadCount;
                    unreadBadge.classList.remove('hidden');
                }

                clone.querySelector('.conversation-item').addEventListener('click', () => {
                    currentConversationId = conversation._id;
                    loadMessages(conversation._id);
                    showChatArea(conversation);
                });

                container.appendChild(clone);
            });
        }

        async function loadMessages(conversationId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/messages/conversations/${conversationId}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    messages = data.messages || [];
                    displayMessages();
                    
                    // Start polling for new messages
                    if (messagePollingInterval) {
                        clearInterval(messagePollingInterval);
                    }
                    messagePollingInterval = setInterval(() => {
                        loadMessages(conversationId);
                    }, 3000);
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        function displayMessages() {
            const container = document.getElementById('messagesArea');
            const template = document.getElementById('messageTemplate');

            container.innerHTML = '';
            messages.forEach(message => {
                const clone = template.content.cloneNode(true);
                const messageDiv = clone.querySelector('.message-bubble');
                
                messageDiv.querySelector('.message-content').textContent = message.message;
                messageDiv.querySelector('.message-time').textContent = formatTime(message.createdAt);
                
                if (message.senderId._id === currentUser._id) {
                    messageDiv.classList.add('sent');
                } else {
                    messageDiv.classList.add('received');
                }

                // Add delete button event listener
                const deleteBtn = clone.querySelector('.delete-message-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteMessage(message._id);
                });

                container.appendChild(clone);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function showChatArea(conversation) {
            // Hide no conversation selected
            document.getElementById('noConversationSelected').classList.add('hidden');
            
            // Show chat area
            document.getElementById('chatHeader').classList.remove('hidden');
            document.getElementById('messagesArea').classList.remove('hidden');
            document.getElementById('messageInput').classList.remove('hidden');

            // Update chat header
            const otherParticipant = conversation.participants.find(p => p._id !== currentUser._id);
            document.getElementById('chatUserAvatar').src = otherParticipant?.profilePicture || 'https://via.placeholder.com/40';
            document.getElementById('chatUserName').textContent = `${otherParticipant?.firstName} ${otherParticipant?.lastName}`;
        }

        function setupEventListeners() {
            // Message form submission
            document.getElementById('messageForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await sendMessage();
            });

            // Back to conversations (mobile)
            document.getElementById('backToConversations').addEventListener('click', () => {
                document.getElementById('chatHeader').classList.add('hidden');
                document.getElementById('messagesArea').classList.add('hidden');
                document.getElementById('messageInput').classList.add('hidden');
                document.getElementById('noConversationSelected').classList.remove('hidden');
            });
        }

        async function sendMessage() {
            const messageText = document.getElementById('messageText');
            const message = messageText.value.trim();

            if (!message || !currentConversationId) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/messages/conversations/${currentConversationId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        message,
                        messageType: 'text'
                    })
                });

                if (response.ok) {
                    messageText.value = '';
                    // Reload messages to show the new one
                    loadMessages(currentConversationId);
                } else {
                    const errorData = await response.json();
                    console.error('Failed to send message:', errorData);
                    alert('Failed to send message: ' + (errorData.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message. Please try again.');
            }
        }

        function formatTime(dateString) {
            if (!dateString) return 'No messages';
            
            const date = new Date(dateString);
            
            // Check if date is valid
            if (isNaN(date.getTime())) {
                return 'Invalid Date';
            }
            
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 1) {
                return 'Just now';
            } else if (diffInHours < 24) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 168) { // 7 days
                return date.toLocaleDateString([], { weekday: 'short' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        async function deleteMessage(messageId) {
            if (!confirm('Are you sure you want to delete this message?')) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                    const response = await fetch(`/api/messages/messages/${messageId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    // Reload messages to update the display
                    if (currentConversationId) {
                        loadMessages(currentConversationId);
                    }
                } else {
                    const error = await response.json();
                    alert('Failed to delete message: ' + error.message);
                }
            } catch (error) {
                console.error('Error deleting message:', error);
                alert('Error deleting message. Please try again.');
            }
        }

        // Clean up polling when page unloads
        window.addEventListener('beforeunload', () => {
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
        });
    </script>
</body>
</html>
