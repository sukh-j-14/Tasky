<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Tasks | Tasky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center hover:opacity-80 transition-opacity">
                        <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center">
                            <i class="fas fa-tasks text-white"></i>
                        </div>
                        <span class="ml-3 text-xl font-bold text-purple-600">Tasky</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="text-gray-600 hover:text-gray-900">Dashboard</a>
                    <a href="browsetask.html" class="text-purple-600 font-medium">Browse Tasks</a>
                    <a href="mytasks.html" class="text-gray-600 hover:text-gray-900">My Tasks</a>
                    <a href="profile.html" class="text-gray-600 hover:text-gray-900">Profile</a>
                    
                    <!-- Login/Signup buttons (shown when not logged in) -->
                    <div id="loginSection" style="display: none;">
                        <a href="login.html" class="text-gray-600 hover:text-gray-900 mr-4">Login</a>
                        <a href="signup.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Sign Up</a>
                    </div>
                    
                    <!-- Profile dropdown (shown when logged in) -->
                    <div id="profileSection" class="relative" style="display: none;">
                        <button id="profileDropdown" class="flex items-center space-x-2 focus:outline-none">
                            <img id="profileImage" src="https://via.placeholder.com/40" alt="Profile" class="w-8 h-8 rounded-full">
                            <span id="profileName" class="text-gray-700">User</span>
                            <i class="fas fa-chevron-down text-gray-400"></i>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
                            <a href="dashboard.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                            </a>
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-user mr-2"></i>Profile
                            </a>
                            <a href="mytasks.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tasks mr-2"></i>My Tasks
                            </a>
                            <a href="browsetask.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-search mr-2"></i>Browse Tasks
                            </a>
                            <hr class="my-2">
                            <a href="#" id="logout" class="block px-4 py-2 text-red-600 hover:bg-red-50">
                                <i class="fas fa-sign-out-alt mr-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Browse Tasks</h1>
            <p class="text-gray-600">Find the perfect task to work on or get help with your projects.</p>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Search -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Search Tasks</label>
                    <input type="text" id="searchInput" placeholder="Search by title, description, or skills..." 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>

                <!-- Category Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="categoryFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <option value="">All Categories</option>
                        <option value="assignment">Assignment</option>
                        <option value="lab-report">Lab Report</option>
                        <option value="research-paper">Research Paper</option>
                        <option value="presentation">Presentation</option>
                        <option value="coding">Coding</option>
                        <option value="design">Design</option>
                        <option value="writing">Writing</option>
                        <option value="translation">Translation</option>
                        <option value="data-analysis">Data Analysis</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Budget Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Max Budget</label>
                    <select id="budgetFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <option value="">Any Budget</option>
                        <option value="50">Under $50</option>
                        <option value="100">Under $100</option>
                        <option value="250">Under $250</option>
                        <option value="500">Under $500</option>
                        <option value="1000">Under $1000</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 flex justify-between items-center">
                <button id="searchBtn" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                    <i class="fas fa-search mr-2"></i>Search
                </button>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="urgentOnly" class="mr-2">
                        <span class="text-sm text-gray-700">Urgent Only</span>
                    </label>
                    <select id="sortBy" class="px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="createdAt">Newest First</option>
                        <option value="deadline">Deadline</option>
                        <option value="budget">Budget</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tasks Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6" id="tasksGrid">
            <!-- Tasks will be loaded here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-8 hidden">
            <i class="fas fa-spinner fa-spin text-2xl text-purple-600"></i>
            <p class="mt-2 text-gray-600">Loading tasks...</p>
        </div>

        <!-- No Tasks Message -->
        <div id="noTasksMessage" class="text-center py-12 hidden">
            <i class="fas fa-search text-4xl text-gray-400 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">No tasks found</h3>
            <p class="text-gray-500">Try adjusting your search criteria or check back later.</p>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-8 flex justify-center hidden">
            <nav class="flex items-center space-x-2">
                <button id="prevPage" class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span id="pageInfo" class="px-4 py-2 text-gray-700"></span>
                <button id="nextPage" class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </nav>
        </div>
    </div>

    <!-- Bid Modal -->
    <div id="bidModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-md w-full p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Place a Bid</h3>
                    <button id="closeBidModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="bidForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Your Bid Amount (₹)</label>
                        <input type="number" id="bidAmount" required min="1" step="0.01"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Proposed Timeline (days)</label>
                        <input type="number" id="bidTimeline" required min="1"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Message to Client</label>
                        <textarea id="bidMessage" required rows="4" placeholder="Explain why you're the best fit for this task..."
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancelBid" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                            Cancel
                        </button>
                        <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            Submit Bid
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="shared/navigation.js"></script>
    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        let currentUser = null;
        let currentPage = 1;
        let totalPages = 1;
        let currentTaskId = null;

        // Initialize page
        async function initPage() {
            try {
                await loadUserProfile();
                await loadTasks();
                setupEventListeners();
            } catch (error) {
                console.error('Error initializing page:', error);
                showNotification('Error loading page data', 'error');
            }
        }

        // Load user profile
        async function loadUserProfile() {
            try {
                const response = await fetch('/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    currentUser = await response.json();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        // Load tasks
        async function loadTasks(page = 1) {
            try {
                showLoading(true);
                
                const searchParams = new URLSearchParams({
                    page: page,
                    limit: 12
                });

                // Add filters
                const search = document.getElementById('searchInput').value;
                const category = document.getElementById('categoryFilter').value;
                const maxBudget = document.getElementById('budgetFilter').value;
                const urgentOnly = document.getElementById('urgentOnly').checked;
                const sortBy = document.getElementById('sortBy').value;

                if (search) searchParams.append('search', search);
                if (category) searchParams.append('category', category);
                if (maxBudget) searchParams.append('maxBudget', maxBudget);
                if (urgentOnly) searchParams.append('urgent', 'true');
                searchParams.append('sortBy', sortBy);

                const response = await fetch(`/api/tasks?${searchParams}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayTasks(data.tasks);
                    updatePagination(data.currentPage, data.totalPages);
                } else {
                    throw new Error('Failed to load tasks');
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
                showNotification('Error loading tasks', 'error');
                document.getElementById('tasksGrid').innerHTML = '<p class="text-gray-500 text-center col-span-full py-8">Error loading tasks</p>';
            } finally {
                showLoading(false);
            }
        }

        // Display tasks
        function displayTasks(tasks) {
            const container = document.getElementById('tasksGrid');
            
            if (tasks.length === 0) {
                document.getElementById('noTasksMessage').classList.remove('hidden');
                container.innerHTML = '';
                return;
            }

            document.getElementById('noTasksMessage').classList.add('hidden');
            
            container.innerHTML = tasks.map(task => `
                <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-lg font-semibold text-gray-900 line-clamp-2">${task.title}</h3>
                            ${task.isUrgent ? '<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full">Urgent</span>' : ''}
                        </div>
                        
                        <p class="text-gray-600 text-sm mb-4 line-clamp-3">${task.description}</p>
                        
                        <div class="flex items-center justify-between text-sm text-gray-500 mb-4">
                            <span class="flex items-center">
                                <i class="fas fa-tag mr-1"></i>
                                ${task.category}
                            </span>
                            <span class="flex items-center">
                                <i class="fas fa-calendar mr-1"></i>
                                ${new Date(task.deadline).toLocaleDateString()}
                            </span>
                        </div>
                        
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-2xl font-bold text-purple-600">₹${task.budget}</span>
                            <span class="px-2 py-1 rounded-full text-xs ${getStatusColor(task.status)}">
                                ${task.status}
                            </span>
                        </div>
                        
                        <div class="flex items-center justify-between text-sm text-gray-500 mb-4">
                            <span>${task.currentBidCount || 0} bids</span>
                            <span>${task.views || 0} views</span>
                        </div>
                        ${task.attachments && task.attachments.length ? `
                            <div class="flex items-center text-sm text-blue-600 mb-4">
                                <i class="fas fa-paperclip mr-2"></i>
                                ${task.attachments.length} supporting document${task.attachments.length === 1 ? '' : 's'} — open View Details to download
                            </div>
                        ` : ''}
                        
                        <div class="flex space-x-2">
                            <button onclick="viewTask('${task._id}')" class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-200 transition-colors">
                                View Details
                            </button>
                            ${currentUser && task.status === 'open' && currentUser._id !== task.clientId._id ? `
                                <button onclick="openBidModal('${task._id}', ${task.budget})" class="flex-1 bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 transition-colors">
                                    Bid Now
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Update pagination
        function updatePagination(current, total) {
            currentPage = current;
            totalPages = total;
            
            const pagination = document.getElementById('pagination');
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                pageInfo.textContent = `Page ${current} of ${total}`;
                prevBtn.disabled = current === 1;
                nextBtn.disabled = current === total;
            } else {
                pagination.classList.add('hidden');
            }
        }

        // Show/hide loading spinner
        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.remove('hidden');
            } else {
                spinner.classList.add('hidden');
            }
        }

        // Get status color
        function getStatusColor(status) {
            const colors = {
                'open': 'bg-green-100 text-green-800',
                'in-progress': 'bg-blue-100 text-blue-800',
                'completed': 'bg-gray-100 text-gray-800',
                'cancelled': 'bg-red-100 text-red-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        // View task details
        function viewTask(taskId) {
            // This would open a detailed task view
            window.location.href = `task-detail.html?id=${taskId}`;
        }

        // Open bid modal
        function openBidModal(taskId, maxBudget) {
            currentTaskId = taskId;
            document.getElementById('bidAmount').max = maxBudget;
            document.getElementById('bidModal').classList.remove('hidden');
        }

        // Close bid modal
        function closeBidModal() {
            document.getElementById('bidModal').classList.add('hidden');
            document.getElementById('bidForm').reset();
            currentTaskId = null;
        }

        // Submit bid
        async function submitBid(event) {
            event.preventDefault();
            
            // Everyone can bid now - no freelancer check needed

            try {
                const bidData = {
                    taskId: currentTaskId,
                    amount: parseFloat(document.getElementById('bidAmount').value),
                    message: document.getElementById('bidMessage').value,
                    proposedTimeline: parseInt(document.getElementById('bidTimeline').value)
                };

                const response = await fetch('/api/bids', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(bidData)
                });

                if (response.ok) {
                    showNotification('Bid submitted successfully!', 'success');
                    closeBidModal();
                    loadTasks(currentPage); // Refresh tasks
                } else {
                    const error = await response.json();
                    if (error.code === 'FREELANCER_REQUIRED') {
                        if (confirm('You need to enable freelancer features in your profile to place bids. Would you like to update your profile now?')) {
                            window.location.href = 'profile.html';
                        }
                    } else {
                        showNotification(error.message || 'Failed to submit bid', 'error');
                    }
                }
            } catch (error) {
                console.error('Error submitting bid:', error);
                showNotification('Error submitting bid', 'error');
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
                type === 'error' ? 'bg-red-500 text-white' : 
                type === 'success' ? 'bg-green-500 text-white' : 
                'bg-blue-500 text-white'
            }`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search and filters
            document.getElementById('searchBtn').addEventListener('click', () => loadTasks(1));
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadTasks(1);
            });

            // Pagination
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 1) loadTasks(currentPage - 1);
            });
            document.getElementById('nextPage').addEventListener('click', () => {
                if (currentPage < totalPages) loadTasks(currentPage + 1);
            });

            // Bid modal
            document.getElementById('closeBidModal').addEventListener('click', closeBidModal);
            document.getElementById('cancelBid').addEventListener('click', closeBidModal);
            document.getElementById('bidForm').addEventListener('submit', submitBid);

            // Close modal on outside click
            document.getElementById('bidModal').addEventListener('click', (e) => {
                if (e.target.id === 'bidModal') closeBidModal();
            });

            // Logout
            document.getElementById('logout').addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
