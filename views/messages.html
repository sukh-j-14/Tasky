<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Tasky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-purple-600">Tasky</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="text-gray-700 hover:text-purple-600">Dashboard</a>
                    <a href="browsetask.html" class="text-gray-700 hover:text-purple-600">Browse Tasks</a>
                    <a href="mytasks.html" class="text-gray-700 hover:text-purple-600">My Tasks</a>
                    <a href="profile.html" class="text-gray-700 hover:text-purple-600">Profile</a>
                    <a href="messages.html" class="text-purple-600 font-medium">Messages</a>
                    
                    <!-- Profile dropdown (shown when logged in) -->
                    <div id="profileSection" class="relative" style="display: none;">
                        <button id="profileDropdown" class="flex items-center space-x-2 focus:outline-none">
                            <img id="profileImage" src="https://via.placeholder.com/40" alt="Profile" class="w-8 h-8 rounded-full">
                            <span id="profileName" class="text-gray-700">User</span>
                            <i class="fas fa-chevron-down text-gray-400"></i>
                        </button>
                        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50">
                            <a href="dashboard.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                            </a>
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-user mr-2"></i>Profile
                            </a>
                            <a href="mytasks.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-tasks mr-2"></i>My Tasks
                            </a>
                            <a href="messages.html" class="block px-4 py-2 text-gray-700 hover:bg-purple-100">
                                <i class="fas fa-envelope mr-2"></i>Messages
                            </a>
                            <hr class="my-2">
                            <a href="#" id="logout" class="block px-4 py-2 text-red-600 hover:bg-red-50">
                                <i class="fas fa-sign-out-alt mr-2"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Messages</h1>
            <p class="text-gray-600">Communicate with clients and freelancers about your tasks.</p>
        </div>

        <!-- Messages Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6" id="messagesGrid">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-8 hidden">
            <i class="fas fa-spinner fa-spin text-2xl text-purple-600"></i>
            <p class="mt-2 text-gray-600">Loading messages...</p>
        </div>

        <!-- No Messages -->
        <div id="noMessages" class="text-center py-12 hidden">
            <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-comments text-purple-600 text-2xl"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">No conversations yet</h3>
            <p class="text-gray-600">Start a conversation by accepting a bid or placing one on a task.</p>
        </div>
    </div>

    <!-- Message Card Template -->
    <template id="messageCardTemplate">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow cursor-pointer">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <img class="conversation-avatar w-12 h-12 rounded-full object-cover" src="https://via.placeholder.com/48" alt="User">
                    </div>
                    <div class="flex-1">
                        <h3 class="conversation-name font-semibold text-gray-900"></h3>
                        <p class="conversation-task text-sm text-purple-600"></p>
                    </div>
                    <div class="text-right flex items-center space-x-2">
                        <span class="conversation-time text-xs text-gray-500"></span>
                        <span id="unreadBadge" class="conversation-unread bg-purple-600 text-white text-xs px-2 py-1 rounded-full hidden"></span>
                        <button class="delete-conversation-btn-header bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-600 transition-colors" title="Delete Conversation">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    </div>
                </div>
                
                <p class="conversation-last-message text-gray-600 text-sm mb-4"></p>
                
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">
                        <i class="fas fa-comments mr-1"></i>
                        <span class="message-count">0</span> messages
                    </span>
                    <div class="flex space-x-2">
                        <button class="open-chat-btn bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">
                            <i class="fas fa-comment mr-2"></i>Open Chat
                        </button>
                        <button class="delete-conversation-btn bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors" title="Delete Conversation">
                            <i class="fas fa-trash mr-2"></i>Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="shared/navigation.js"></script>
    <script>
        let currentUser = null;
        let conversations = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            loadConversations();
        });

        async function loadUserProfile() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    currentUser = await response.json();
                }
            } catch (error) {
                console.error('Error loading user profile:', error);
            }
        }

        async function loadConversations() {
            try {
                showLoading(true);
                
                const token = localStorage.getItem('token');
                const response = await fetch('/api/messages/conversations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    conversations = data.conversations || [];
                    displayConversations();
                } else {
                    throw new Error('Failed to load conversations');
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
                showError();
            } finally {
                showLoading(false);
            }
        }

        function displayConversations() {
            const container = document.getElementById('messagesGrid');
            const template = document.getElementById('messageCardTemplate');

            if (conversations.length === 0) {
                document.getElementById('noMessages').classList.remove('hidden');
                container.innerHTML = '';
                return;
            }

            document.getElementById('noMessages').classList.add('hidden');
            container.innerHTML = '';

            conversations.forEach(conversation => {
                const clone = template.content.cloneNode(true);
                
                // Get the other participant
                const otherParticipant = conversation.participants.find(p => p._id !== currentUser._id);
                
                clone.querySelector('.conversation-avatar').src = otherParticipant?.profilePicture || 'https://via.placeholder.com/48';
                clone.querySelector('.conversation-name').textContent = `${otherParticipant?.firstName} ${otherParticipant?.lastName}`;
                clone.querySelector('.conversation-time').textContent = formatTime(conversation.lastMessageAt);
                clone.querySelector('.conversation-last-message').textContent = conversation.lastMessage?.message || 'No messages yet';
                clone.querySelector('.conversation-task').textContent = conversation.taskId?.title || 'General Chat';
                
                if (conversation.unreadCount > 0) {
                    const unreadBadge = clone.querySelector('.conversation-unread');
                    unreadBadge.textContent = conversation.unreadCount;
                    unreadBadge.classList.remove('hidden');
                }

                // Add click event to open chat
                clone.querySelector('.open-chat-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openChat(conversation);
                });

                // Add click event to delete conversation (bottom button)
                clone.querySelector('.delete-conversation-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteConversation(conversation);
                });

                // Add click event to delete conversation (header button)
                clone.querySelector('.delete-conversation-btn-header').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteConversation(conversation);
                });

                // Add click event to the entire card
                clone.querySelector('.bg-white').addEventListener('click', () => {
                    openChat(conversation);
                });

                container.appendChild(clone);
            });
        }

        function openChat(conversation) {
            // Open chat in a new window/tab
            const chatUrl = `chat.html?conversationId=${conversation._id}`;
            window.open(chatUrl, '_blank');
        }

        async function deleteConversation(conversation) {
            const participantName = conversation.participants.find(p => p._id !== currentUser._id)?.firstName || 'this person';
            if (!confirm(`Are you sure you want to delete this conversation with ${participantName}? This will remove it from your messages list, but the other person will still see it.`)) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/messages/conversations/${conversation._id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('Conversation deleted successfully!');
                    // Reload conversations to update the list
                    loadConversations();
                } else {
                    const error = await response.json();
                    alert('Failed to delete conversation: ' + error.message);
                }
            } catch (error) {
                console.error('Error deleting conversation:', error);
                alert('Error deleting conversation. Please try again.');
            }
        }

        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.remove('hidden');
            } else {
                spinner.classList.add('hidden');
            }
        }

        function showError() {
            document.getElementById('messagesGrid').innerHTML = `
                <div class="col-span-full text-center py-12 text-red-500">
                    <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                    <p>Failed to load messages. Please try again later.</p>
                </div>
            `;
        }

        function formatTime(dateString) {
            if (!dateString) return 'No messages';
            
            const date = new Date(dateString);
            
            // Check if date is valid
            if (isNaN(date.getTime())) {
                return 'Invalid Date';
            }
            
            const now = new Date();
            const diffInHours = (now - date) / (1000 * 60 * 60);

            if (diffInHours < 1) {
                return 'Just now';
            } else if (diffInHours < 24) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diffInHours < 168) { // 7 days
                return date.toLocaleDateString([], { weekday: 'short' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }
    </script>
</body>
</html>
